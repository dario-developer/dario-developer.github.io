<!DOCTYPE html>
<html lang="es" class="h-100">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Portfolio Darío Navarro</title>

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

        <!-- Mi css -->
        <link rel="stylesheet" href="Css/decoracion-generada.css">  <!-- medidas de las piezas (lo genera media/img/Deco/generar-decoracion.ps1) -->
        <link rel="stylesheet" href="Css/styles.css">
        <!-- Transición entre páginas (va en el head para que no parpadee) -->
        <script src="Js/transicion.js"></script>
    </head>
    <body class="container h-md-100">
        <!-- CARTEL de cabecera con nombre, logo, etc.
             .pf-cartel = cartel por piezas (variables --cartel-* del css)  |  .pf-header = contenido en fila. -->
        <header class="pf-cartel pf-header mt-3" data-palos="0.1 0.9">  <!-- data-palos: palos que bajan del cartel al suelo (posición = fracción del ancho) -->
            <p>Darío Navarro</p>

            <!-- PONER LOGO BUENO -->
            <img class="pf-logo rounded-5" src="https://picsum.photos/100" alt="Mi logo">

            <p class="text-end">Game designer</p>
        </header>

        <!-- TABLÓN de anuncios.
             .pf-board = fondo de madera (variables --tablon-* del css).
             El .row de dentro contiene las TARJETAS (.pf-card) con el papel .pf-folio (variables --folio-* del css). -->
        <div class="pf-board pf-board-pantalla mb-4">  <!-- pf-board-pantalla: en portátil o más, se ajusta para que el index quepa en la pantalla -->
            <!-- IDIOMA: banderas enmarcadas en la hoja azul (.pf-marco). Js/idioma.js hace el resto -->
            <nav class="pf-idiomas" aria-label="Idioma">
                <button type="button" class="pf-idioma" data-idioma="es" title="Cambiar a español">
                    <img class="pf-marco" src="media/img/Banderas/espana.svg" alt="Español">
                </button>
                <button type="button" class="pf-idioma" data-idioma="en" title="Cambiar a inglés">
                    <img class="pf-marco" src="media/img/Banderas/reino-unido.svg" alt="Inglés">
                </button>
            </nav>

            <div class="row gy-3 gy-lg-0 gx-3 justify-content-evenly">

                <!-- FOLIO 1 -->
                <div class="col-12 col-sm-6 col-lg-3">
                    <a class="pf-card pf-folio" href="HTML/sobremi.html">
                        <img class="img-fluid" src="/media/img/Yo/Darío Navarro.png" alt="Imagen sobre mí">
                        <p class="pf-card-text">Sobre mi</p>
                    </a>
                </div>

                <!-- FOLIO 2 -->
                <div class="col-12 col-sm-6 col-lg-3">
                    <a class="pf-card pf-folio" href="HTML/proyectos.html">
                        <img class="img-fluid" src="https://picsum.photos/400" alt="Imagen proyectos">
                        <p class="pf-card-text">Proyectos</p>
                    </a>
                </div>

                <!-- FOLIO 3 -->
                <div class="col-12 col-sm-6 col-lg-3">
                    <a class="pf-card pf-folio" href="HTML/lineatiempo.html" data-transicion="arriba">  <!-- viaje a las estrellas (Js/transicion.js) -->
                        <img class="img-fluid" src="https://picsum.photos/400" alt="Imagen línea de tiempo">
                        <p class="pf-card-text">Linea de tiempo</p>
                    </a>
                </div>

                <!-- FOLIO 4 -->
                <div class="col-12 col-sm-6 col-lg-3">
                    <a class="pf-card pf-folio" href="HTML/sobremi.html">
                        <img class="img-fluid" src="https://picsum.photos/400" alt="Imagen CV">
                        <p class="pf-card-text">CV</p>
                    </a>
                </div>

            </div>
        </div>

        <!-- LIBRERÍAS -->
        <!-- SUELO: footer vacío con el césped de fondo (los palos se clavan en él) -->
        <footer class="pf-suelo" aria-hidden="true"></footer>

        <!-- JQueries -->
        <script src="js/libraries/jquery.js"></script>

        <!-- JS de los folios (crea las esquinas y lados de cada .pf-folio) -->
        <script src="Js/folio.js"></script>

        <!-- Mi JS -->
        <script src="Js/script.js"></script>
        <!-- Traducción español / inglés -->
        <script src="Js/idioma.js"></script>
    </body>
</html>
