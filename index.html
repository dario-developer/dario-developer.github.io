<!DOCTYPE html>

    <head>

        <title>Portfolio Darío Navarro</title>

    <body class="container">

        <header class="pf-header pf-heading mt-2 p-4 rounded-4">

        <div class="pf-board rounded-4 my-4 p-3">
            <div class="row justify-content-evenly g-3">

                <!-- Columna izquierda -->
                <section class="pf-col col-12 col-sm-3">
                    <a class="pf-card" href="HTML/proyectos.html">

                    </a>

                <section class="pf-col col-12 col-sm-3">
                    <article class="pf-card">
                        <img src="https://picsum.photos/400" alt="Imagen de mejores proyectos">

                    </article>
                    <article class="pf-card">
                        <img src="https://picsum.photos/400" alt="Imagen de mejores proyectos">
                        <p class="pf-card-text">CV</p>
                    </article>
                </section>
            </div>

        <!-- LIBRERÍAS -->
        <!-- JQueries -->
        <script src="js/libraries/jquery.js"></script>

        <!-- Mi JS -->
        <script src="Js/script.js"></script>
