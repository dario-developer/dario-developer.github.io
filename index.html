<!DOCTYPE html>
<html lang="es" class="h-100">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Portfolio Darío Navarro</title>

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

        <!-- Mi css -->
        <link rel="stylesheet" href="Css/styles.css">
    </head>
    <body class="container h-md-100">
        <!-- TITULAR. Cabecera con nombre, logo, etc.
             .pf-titular = tablón grande de fondo  |  .pf-placa = rótulo oscuro con el texto.
             Solo hay que poner las clases; las imágenes se cambian en el css (variables --titular-* y --placa-*). -->
        <header class="pf-titular mt-2">
            <div class="pf-placa pf-header">
                <p>Darío Navarro</p>

                <!-- PONER LOGO BUENO -->
                <img class="rounded-5 w-auto" src="https://picsum.photos/100" alt="Mi logo">

                <p class="text-end">Game designer</p>
            </div>
        </header>

        <!-- TABLÓN de anuncios.
             .pf-board = fondo de madera (variables --tablon-* del css).
             El .row de dentro contiene los FOLIOS (.pf-card) pegados encima (variables --folio-* del css). -->
        <div class="pf-board my-4">
            <div class="row gy-3 gy-lg-0 gx-3 justify-content-evenly align-items-center">

                <!-- FOLIO 1 -->
                <div class="col-12 col-sm-6 col-lg-3 ">
                    <a class="pf-card" href="HTML/sobremi.html">
                        <img class="img-fluid" src="https://picsum.photos/400" alt="Imagen sobre mí">
                        <p class="pf-card-text">Sobre mi</p>
                    </a>
                </div>

                <!-- FOLIO 2 -->
                <div class="col-12 col-sm-6 col-lg-3">
                    <a class="pf-card" href="HTML/proyectos.html">
                        <img class="img-fluid" src="https://picsum.photos/400" alt="Imagen proyectos">
                        <p class="pf-card-text">Proyectos</p>
                    </a>
                </div>

                <!-- FOLIO 3 -->
                <div class="col-12 col-sm-6 col-lg-3">
                    <a class="pf-card" href="HTML/lineatiempo.html">
                        <img class="img-fluid" src="https://picsum.photos/400" alt="Imagen línea de tiempo">
                        <p class="pf-card-text">Linea de tiempo</p>
                    </a>
                </div>

                <!-- FOLIO 4 -->
                <div class="col-12 col-sm-6 col-lg-3">
                    <a class="pf-card" href="HTML/sobremi.html">
                        <img class="img-fluid" src="https://picsum.photos/400" alt="Imagen CV">
                        <p class="pf-card-text">CV</p>
                    </a>
                </div>

            </div>
        </div>

        <!-- LIBRERÍAS -->
        <!-- JQueries -->
        <script src="js/libraries/jquery.js"></script>

        <!-- Mi JS -->
        <script src="Js/script.js"></script>
    </body>

    <footer>

    </footer>
</html>
