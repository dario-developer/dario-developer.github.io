<!DOCTYPE html>
<html lang="es" class="h-100">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Portfolio Darío Navarro</title>

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

        <!-- Mi css -->
        <link rel="stylesheet" href="Css/styles.css">
    </head>
    <body class="container h-md-100">
        <!-- CARTEL de cabecera con nombre, logo, etc.
             .pf-cartel = cartel por piezas (variables --cartel-* del css)  |  .pf-header = contenido en fila. -->
        <header class="pf-cartel pf-header mt-3">
            <p>Darío Navarro</p>

            <!-- PONER LOGO BUENO -->
            <img class="pf-logo rounded-5" src="https://picsum.photos/100" alt="Mi logo">

            <p class="text-end">Game designer</p>
        </header>

        <!-- TABLÓN de anuncios.
             .pf-board = fondo de madera (variables --tablon-* del css).
             El .row de dentro contiene las TARJETAS (.pf-card) con el papel .pf-folio (variables --folio-* del css). -->
        <div class="pf-board mb-4">
            <div class="row gy-3 gy-lg-0 gx-3 justify-content-evenly">

                <!-- FOLIO 1 -->
                <div class="col-12 col-sm-6 col-lg-3">
                    <a class="pf-card pf-folio" href="HTML/sobremi.html">
                        <img class="img-fluid" src="/media/img/Yo/Darío Navarro.png" alt="Imagen sobre mí">
                        <p class="pf-card-text">Sobre mi</p>
                    </a>
                </div>

                <!-- FOLIO 2 -->
                <div class="col-12 col-sm-6 col-lg-3">
                    <a class="pf-card pf-folio" href="HTML/proyectos.html">
                        <img class="img-fluid" src="https://picsum.photos/400" alt="Imagen proyectos">
                        <p class="pf-card-text">Proyectos</p>
                    </a>
                </div>

                <!-- FOLIO 3 -->
                <div class="col-12 col-sm-6 col-lg-3">
                    <a class="pf-card pf-folio" href="HTML/lineatiempo.html">
                        <img class="img-fluid" src="https://picsum.photos/400" alt="Imagen línea de tiempo">
                        <p class="pf-card-text">Linea de tiempo</p>
                    </a>
                </div>

                <!-- FOLIO 4 -->
                <div class="col-12 col-sm-6 col-lg-3">
                    <a class="pf-card pf-folio" href="HTML/sobremi.html">
                        <img class="img-fluid" src="https://picsum.photos/400" alt="Imagen CV">
                        <p class="pf-card-text">CV</p>
                    </a>
                </div>

            </div>
        </div>

        <!-- LIBRERÍAS -->
        <!-- JQueries -->
        <script src="js/libraries/jquery.js"></script>

        <!-- JS de los folios (crea las esquinas y lados de cada .pf-folio) -->
        <script src="Js/folio.js"></script>

        <!-- Mi JS -->
        <script src="Js/script.js"></script>
    </body>

    <footer>

    </footer>
</html>
